<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wine Queue · My wine list</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><header class="topbar"><a class="brand" href="dashboard.html"><img src="icons/icon48.png" alt=""> WINE QUEUE</a><div class="actions"><button id="export">Export CSV</button><button id="backup">Export backup</button><button id="add" class="primary">+ Add manually</button></div></header>
<main><section class="intro"><h1>My list</h1></section>
<section class="stats" id="stats"></section>
<section class="toolbar"><input id="search" type="search" placeholder="Search wine, vintage, merchant…" aria-label="Search list"><div class="filters"><button class="active" data-filter="watching">Wish list</button><button data-filter="ready">Threshold reached</button><button data-filter="purchased">Purchased</button></div><select id="sort" aria-label="Sort"><option value="recent">Recently added</option><option value="score">CT score, high to low</option><option value="price">Price, low to high</option></select></section>
<p id="message" role="status"></p><div id="merchants"></div>
<footer>Totals are unit price × quantity, before tax. Prices and stock are from when you saved each wine and don't update on their own.</footer>
</main></div><dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title">Edit wine</h2><button id="close" aria-label="Close">✕</button></div><form id="edit-form"></form><p id="dialog-error" class="error" role="alert"></p><button id="dialog-save" type="submit" form="edit-form" class="primary full">Save</button></dialog><script type="module" src="dashboard.js"></script></body></html>
